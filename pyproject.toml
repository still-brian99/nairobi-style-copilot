[project]
name = "nairobi-style-copilot"
version = "0.1.0"
description = "AI business operating copilot for Nairobi fashion and retail entrepreneurs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "openai-agents>=0.2,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "httpx>=0.28,<1",
  "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
